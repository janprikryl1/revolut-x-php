site_name: Revolut X PHP SDK
site_description: PHP SDK for the Revolut X Crypto Exchange REST API (v1.0)
site_url: https://janprikryl1.github.io/revolut-x-php/
repo_name: janprikryl/revolut-x-php
repo_url: https://github.com/janprikryl1/revolut-x-php
copyright: "Copyright &copy; 2026 Jan Přikryl | Diplomová práce VŠB-TUO"

theme:
  name: ivory
  logo: assets/logo.png

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - User Guides:
      - Public Market Data: guide/market_data.md
      - Order Management: guide/orders.md
      - Account & Balances: guide/account.md
      - 0% Fee Maker Strategy: guide/maker_strategy.md
      - AI Agent Integration: guide/ai_agents.md
  - Protocol Concepts:
      - Ed25519 Authentication: concepts/auth_ed25519.md
      - Maker vs Taker Fee Model: concepts/maker_strategy.md
  - API Reference: api/reference.md
