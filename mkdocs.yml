site_name: Revolut X PHP SDK
site_description: PHP SDK for the Revolut X Crypto Exchange REST API (v1.0)
site_url: https://janprikryl1.github.io/revolut-x-php/
repo_name: janprikryl/revolut-x-php
repo_url: https://github.com/janprikryl1/revolut-x-php
copyright: "Copyright &copy; 2026 Jan Přikryl | Diplomová práce VŠB-TUO"

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  # Verify Google Search Console:
  google_site_verification: "tNkr4srMPz0aD-ynrqRJOvq0eVSvvL6cMDe0tbks1aw"

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
        - locale: cs
          name: Čeština
          site_description: PHP klientská knihovna pro Revolut X Crypto Exchange REST API (v1.0)
          nav_translations:
            Home: Domů
            Quick Start: Rychlý start
            User Guides: Uživatelské příručky
            Public Market Data: Veřejná tržní data
            Order Management: Správa objednávek
            Account & Balances: Účet a zůstatky
            0% Fee Maker Strategy: 0% Maker strategie
            AI Agent Integration: Integrace AI agentů
            Protocol Concepts: Koncepty protokolu
            Ed25519 Authentication: Autentizace Ed25519
            Maker vs Taker Fee Model: Model poplatků Maker vs Taker
            API Reference: API Reference

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - User Guides:
      - Public Market Data: guide/market_data.md
      - Order Management: guide/orders.md
      - Account & Balances: guide/account.md
      - 0% Fee Maker Strategy: guide/maker_strategy.md
      - AI Agent Integration: guide/ai_agents.md
  - Protocol Concepts:
      - Ed25519 Authentication: concepts/auth_ed25519.md
      - Maker vs Taker Fee Model: concepts/maker_strategy.md
  - API Reference: api/reference.md
